name: Generate Snake

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）自动生成一次
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sxhjlzl
          outputs: |
            profile-assets/github-contribution-grid-snake.svg
            profile-assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: "profile-assets/*.svg"
